services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: solomad
      POSTGRES_PASSWORD: solomad
      POSTGRES_DB: solomad
    ports:
      - "5432:5432"
    volumes:
      - solomad_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solomad -d solomad"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - solomad_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      DEBUG: 0
    volumes:
      - solomad_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  solomad_pg:
  solomad_redis:
  solomad_localstack:
