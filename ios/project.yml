# RETIRED reference. Do not generate a project from this file.
# ios/NomadTable.xcodeproj and its shared scheme are the source of truth.
# XcodeGen is not required and is not invoked by the Makefile.
# The official supabase-swift 2.55.3 pin stays documented in docs/LOCAL_DEVELOPMENT.md
# until git access to github.com works. It is not linked in the Xcode project.
name: NomadTable
options:
  bundleIdPrefix: app.solomad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  NomadTableAPIClient:
    path: Packages/NomadTableAPIClient
targets:
  NomadTable:
    type: application
    platform: iOS
    sources:
      - path: NomadTable
    dependencies:
      - package: NomadTableAPIClient
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.solomad.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NomadTable/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          INFOPLIST_FILE: NomadTable/Info-Debug.plist
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_STYLE: Automatic
          INFOPLIST_FILE: NomadTable/Info.plist
    scheme:
      testTargets: []
    info:
      path: NomadTable/Info.plist
      properties:
        CFBundleDisplayName: solomad
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: solomad uses your location to show activities near you. You can choose a city instead.
        NSCameraUsageDescription: solomad uses the camera for profile verification.
        NSPhotoLibraryUsageDescription: solomad uses photos you choose for your profile and chats.
        NSUserNotificationsUsageDescription: solomad sends alerts for activities, chats, and trips you join.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        APIBaseURL: $(API_BASE_URL)
        RealtimeBaseURL: $(REALTIME_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: app.solomad.ios.auth
            CFBundleURLSchemes: [app.solomad.ios]
  NomadTableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NomadTableTests
    dependencies:
      - target: NomadTable
schemes:
  NomadTable:
    build:
      targets:
        NomadTable: all
        NomadTableTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NomadTableTests
    archive:
      config: Release
